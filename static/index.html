async function startCamera(){if(scanning){stopCamera();renderContent();return}const panel=$('#scan-panel');if(!navigator.mediaDevices?.getUserMedia){toast('La caméra nécessite un navigateur compatible et une connexion sécurisée (HTTPS)',true);return}try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});scanning=true;let video=document.createElement('video');video.setAttribute('playsinline','');video.setAttribute('autoplay','');video.muted=true;video.srcObject=cameraStream;panel.innerHTML='';panel.appendChild(video);await video.play();const detector=typeof BarcodeDetector==='function'?new BarcodeDetector({formats:['code_39','code_128','qr_code','ean_13']}):null;if(!detector){toast('Lecture automatique non prise en charge sur ce navigateur : utilisez la douchette ou la saisie manuelle',true);return}toast('Caméra active. Présentez une étiquette.');const token=++activeCameraRun;let loops=0;async function tick(){if(!scanning||token!==activeCameraRun)return;try{let reads=await detector.detect(video);for(let r of reads){const value=String(r.rawValue||'').trim().toUpperCase();if(value.startsWith('STK-')){stopCamera();lookup(value);return}}}catch(e){}if(scanning&&token===activeCameraRun){loops++;setTimeout(tick,250)}}tick()}catch(e){stopCamera();toast('Impossible d’accéder à la caméra. Vérifiez les autorisations ou utilisez un scanner USB.',true)}}
function stopCamera(){scanning=false;activeCameraRun++;if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}
function searchGlobal(v){searchTerm=v;page='products';tableFilter=v;renderApp();const f=$('#filter-products');if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}}
// Global delegated controls
window.addEventListener('click',ev=>{if(SPV3.onClick(ev,{db,api,refreshState,renderContent,toast,printLabel,page,setSlot}))return;const n=ev.target.closest('[data-nav]');if(n){nav(n.dataset.nav);return}const slot=ev.target.closest('[data-slot]');if(slot){setSlot(slot.dataset.slot);return}const a=ev.target.closest('[data-action]');if(!a)return;const act=a.dataset.action,id=a.dataset.id;if(act==='backdrop'){if(ev.target===a)closeModal();return}switch(act){case'save-shelf':(async()=>{if(me.role!=='admin')return;const slot=a.dataset.slot;try{await api('/api/shelves/'+encodeURIComponent(slot),'PATCH',{size:$('#shelf-size')?.value||'unknown',note:$('#shelf-note')?.value||''});await refreshState(true);renderContent();toast('Niveau '+slot+' mis à jour')}catch(e){toast(e.message,true)}})();break;case'clearstock':openModal({type:'clearstock'});break;case'doclearstock':(async()=>{if($('#clear-confirm')?.value!=='VIDER LE STOCK')return toast('Confirmation incorrecte',true);try{await api('/api/admin/clear-stock','POST',{confirmation:'VIDER LE STOCK'});lastAdded=null;scanResult=null;modal=null;selectedProduct=null;await refreshState(true);nav('dashboard');toast('Stock vidé. Sauvegarde créée sur le NAS.')}catch(e){toast(e.message,true)}})();break;case'save-rule':(async()=>{if(me.role!=='admin')return;const slot=$('#rule-'+id)?.value??'';try{await api('/api/products/'+encodeURIComponent(id),'PATCH',{preferred_slot:slot});await refreshState(true);renderContent();toast(slot?'Emplacement conseillé enregistré':'Suggestion de rangement effacée')}catch(e){toast(e.message,true)}})();break;case'setlocationmode':(async()=>{if(me.role!=='admin')return;try{const mode=a.dataset.mode;await api('/api/settings/location-mode','POST',{mode});locationMode=mode;await refreshState(true);renderApp();toast('Mode de rangement mis à jour')}catch(e){toast(e.message,true)}})();break;case'menu':mobileNav=true;renderApp();break;case'closemenu':mobileNav=false;renderApp();break;case'newentry':goEntry();break;case'goexit':goExit();break;case'gomap':nav('map');break;case'saveentry':recordEntry();break;case'print':printLabel(id);break;case'lookup':lookup($('#scan-code')?.value);break;case'sample':{let sample=db.items[db.items.length-1];if(sample)lookup(sample.id);else toast('Stock vide : enregistrez d’abord un article',true);break}case'camera':startCamera();break;case'selectscan':scanResult=itemById(id);renderContent();break;case'confirmout':case'outfrommodal':openModal({type:'confirmout',id});break;case'remove':removeItem(id);break;case'details':openModal({type:'details',id});break;case'closemodal':closeModal();break;case'entryslot':selectedProduct=db.catalog.find(p=>p.zone===a.dataset.slot[0])?.id||db.catalog[0]?.id||null;chosenSlot=a.dataset.slot;lastAdded=null;nav('entry');SPV3.selectSlot(a.dataset.slot);renderContent();break;case'zone':selectedSlot=`${a.dataset.zone}-1`;renderContent();break;case'pickslot':setSlot(a.dataset.slot);break;case'export':exportStock();break;case'exporthistory':exportHistory();break;case'clearstock':openModal({type:'clearstock'});break;case'reset':openModal({type:'reset'});break;case'doreset':(async()=>{try{await api('/api/admin/reset','POST',{});formSerial='';lastAdded=null;scanResult=null;selectedSlot='A-1';modal=null;await refreshState(true);nav('dashboard');toast('Stock fictif réinitialisé')}catch(e){toast(e.message,true)}})();break;case'movemodal':openModal({type:'move',id});break;case'confirmmove':(async()=>{try{await api('/api/items/'+encodeURIComponent(id)+'/move','POST',{slot:$('#move-slot')?.value});modal=null;await refreshState(true);renderApp();toast('Article déplacé')}catch(e){toast(e.message,true)}})();break;case'editproduct':openModal({type:'editproduct',id});break;case'listusers':(async()=>{try{users=(await api('/api/users')).users;openModal({type:'users'})}catch(e){toast(e.message,true)}})();break;case'toggleuser':(async()=>{const u=users.find(x=>String(x.id)===String(id));if(!u)return;try{await api('/api/users/'+id,'PATCH',{enabled:!u.enabled});users=(await api('/api/users')).users;openModal({type:'users'});toast('Compte mis à jour')}catch(e){toast(e.message,true)}})();break;case'backup':window.open('/api/backup','_blank');break;}});
window.addEventListener('submit',async e=>{const f=e.target;if(!['catalog-form','user-form','password-form','edit-product-form'].includes(f.id))return;e.preventDefault();const data=Object.fromEntries(new FormData(f).entries());try{if(f.id==='catalog-form'){await api('/api/products','POST',data);toast('Référence ajoutée')}else if(f.id==='user-form'){await api('/api/users','POST',data);toast('Compte employé créé')}else if(f.id==='edit-product-form'){data.active=!!f.querySelector('[name=active]').checked;await api('/api/products/'+encodeURIComponent(f.dataset.id),'PATCH',data);modal=null;toast('Produit modifié')}else{await api('/api/me/password','POST',data);toast('Mot de passe modifié')}f.reset();await refreshState(true);renderApp()}catch(err){toast(err.message,true)}});
window.addEventListener('change',e=>{if(SPV3.onChange(e,{refreshState,renderContent,toast}))return;if(e.target.id==='product-select'){selectedProduct=e.target.value;chosenSlot=null;renderContent()}else if(e.target.id==='condition-in'){formCondition=e.target.value}else if(e.target.id==='slot-in'){chosenSlot=e.target.value;selectedSlot=chosenSlot;renderContent()}else if(e.target.id==='filter-zone'){tableZone=e.target.value;renderContent()}else if(e.target.id==='filter-type'){tableType=e.target.value;renderContent()}});
window.addEventListener('input',e=>{if(SPV3.onInput(e,db))return;if(e.target.id==='serial-in'){formSerial=e.target.value}else if(e.target.id==='filter-products'){tableFilter=e.target.value;let st=e.target.selectionStart;renderContent();const inp=$('#filter-products');if(inp){inp.focus();inp.setSelectionRange(st,st)}}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal();else if(e.key==='Enter'&&e.target.id==='scan-code'){e.preventDefault();lookup(e.target.value)}else if(e.key==='Enter'&&e.target.id==='global-search'){e.preventDefault();searchGlobal(e.target.value)}else if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-slot]')){e.preventDefault();setSlot(e.target.dataset.slot)}});
window.addEventListener('pagehide',stopCamera);
document.querySelector('#app').innerHTML='<div style="display:grid;place-items:center;min-height:100vh;color:#53657f;font-family:system-ui">Chargement du stock partagé…</div>';
if('scrollRestoration' in history)history.scrollRestoration='manual';
refreshState().then(()=>window.scrollTo(0,0));
setInterval(()=>{if(!document.hidden&&!modal&&page!=='entry'&&page!=='exit')refreshState(true)},20000);
})();
</script>
</body>
