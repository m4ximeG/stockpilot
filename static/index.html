function darken(hex,amount){let num=parseInt(hex.slice(1),16);let a=n=>Math.max(0,Math.min(255,n+amount));return '#'+[a(num>>16),a((num>>8)&255),a(num&255)].map(n=>n.toString(16).padStart(2,'0')).join('')}

function renderEntry(){const p=product(selectedProduct)||db.catalog.find(x=>x.active);if(!p){return `${heading('RÉCEPTION','Aucune référence disponible','Ajoutez d’abord des produits dans Configuration.')}<button class="btn primary" data-nav="settings">Créer une référence</button>`}let recommended=firstFree(p.zone);if(chosenSlot&&itemAt(chosenSlot))chosenSlot=null;let slot=chosenSlot||recommended;let zones=ZONES.map(z=>`<option value="${z.id}">${z.id} — ${z.label}</option>`).join('');if(lastAdded){const item=lastAdded,ip=product(item.pid);return `${heading('RÉCEPTION MARCHANDISE','Entrée enregistrée','Votre produit est maintenant en stock et son étiquette est prête.',btn('Nouvelle entrée','newentry','plus',''))}<div class="card formcard success-page"><div class="success-icon">${ico('check',34)}</div><h2>Produit réceptionné avec succès</h2><p>Le produit est enregistré. Collez l'étiquette, puis rangez-le à l'emplacement indiqué.</p><div class="reco"><div class="recohead">${ico('pin',16)} Emplacement attribué</div><h3>${pretty(item.slot)}</h3><p>${esc(displayName(ip))} · ${esc(item.id)}</p></div>${renderLabel(item)}<div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn primary" data-action="print" data-id="${item.id}">${ico('printer',17)} Imprimer l’étiquette</button><button class="btn" data-nav="map">${ico('layers',17)} Voir sur le plan</button><button class="btn" data-action="newentry">${ico('plus',16)} Ajouter un autre</button></div></div>`}
return `${heading('FLUX D’ENTRÉE','Réceptionner un produit','Enregistrez le colis, attribuez un emplacement et générez son étiquette.',btn('Voir le dépôt','gomap','layers',''))}<div class="steps"><div class="step active"><i>1</i> Produit</div><div class="stepbar"></div><div class="step active"><i>2</i> Emplacement</div><div class="stepbar"></div><div class="step"><i>3</i> Étiquette</div></div><div class="flowgrid"><section class="card formcard"><h2>Nouvelle entrée en stock</h2><p class="intro">Sélectionnez une référence déjà enregistrée dans le catalogue de votre entreprise.</p><div class="field"><label for="product-select">Produit / modèle *</label><select id="product-select">${db.catalog.filter(p=>p.active).map(p=>`<option value="${p.id}" ${p.id===selectedProduct?'selected':''}>${esc(displayName(p))} — ${esc(p.cat)}</option>`).join('')}</select><div class="productpick"><div class="prodicon">${ico(p.kind,25)}</div><div><strong>${esc(displayName(p))}</strong><small>Référence ${esc(p.ref)} · ${esc(p.cat)}</small></div></div></div><div class="twofields"><div class="field"><label for="serial-in">Numéro de série (facultatif)</label><input id="serial-in" maxlength="80" placeholder="Ex. CND3412ABC" autocomplete="off" value="${esc(formSerial)}"></div><div class="field"><label for="condition-in">État du produit</label><select id="condition-in">${['Neuf','Reconditionné','Occasion','Retour SAV'].map(c=>`<option ${c===formCondition?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="field"><label for="slot-in">Emplacement à utiliser</label><select id="slot-in">${ALLSLOTS.filter(s=>!itemAt(s)).map(s=>`<option value="${s}" ${s===slot?'selected':''}>${pretty(s)} ${s[0]!==p.zone?'(hors zone prévue)':''}</option>`).join('')||'<option value="">Stock complet</option>'}</select></div><div class="hint">${ico('info',15)} Le rangement est conseillé selon la <strong>marque / catégorie</strong>. La case peut être modifiée manuellement, ou sélectionnée sur le plan à droite. Chaque case reçoit un article.</div><div style="margin-top:22px">${btn('Enregistrer et générer l’étiquette','saveentry','check','primary full')}</div></section><section><div class="card formcard" style="margin-bottom:15px"><div class="eyebrow">RANGEMENT ASSISTÉ</div><h2>Emplacement conseillé</h2>${recommended?`<div class="reco"><div class="recohead">${ico('check',17)} ${chosenSlot?'Emplacement sélectionné':'Position calculée automatiquement'}</div><h3>${pretty(slot)}</h3><p>${slot?.[0]===p.zone?`Zone dédiée : ${ZONES.find(z=>z.id===p.zone)?.label}`:'Attention : emplacement hors zone habituelle'}</p></div>`:`<div class="reco" style="background:#fff0f1;border-color:#ffcccf"><h3 style="color:#b93243">Zone dédiée complète</h3><p>Choisissez une autre zone disponible avant validation.</p></div>`}<div class="minimap">${renderMap('mini')}</div><p style="font-size:11px;color:#8998ac;margin:7px 0 0">Cliquez sur une case libre sur le plan pour la sélectionner.</p></div><div class="card formcard"><div style="display:flex;gap:11px;align-items:center"><div class="icbox blue">${ico('printer')}</div><div><strong>Étiquette automatique</strong><div style="font-size:11px;color:#8998ac;margin-top:5px">Code-barres scannable après validation</div></div></div></div></section></div>`}
function barcodeSVG(text,width=260,height=74){const dict={'0':'101001101101','1':'110100101011','2':'101100101011','3':'110110010101','4':'101001101011','5':'110100110101','6':'101100110101','7':'101001011011','8':'110100101101','9':'101100101101','A':'110101001011','B':'101101001011','C':'110110100101','D':'101011001011','E':'110101100101','F':'101101100101','G':'101010011011','H':'110101001101','I':'101101001101','J':'101011001101','K':'110101010011','L':'101101010011','M':'110110101001','N':'101011010011','O':'110101101001','P':'101101101001','Q':'101010110011','R':'110101011001','S':'101101011001','T':'101011011001','U':'110010101011','V':'100110101011','W':'110011010101','X':'100101101011','Y':'110010110101','Z':'100110110101','-':'100101011011','*':'100101101101',' ':'100110101101'};let encoded='*'+text.toUpperCase().replace(/[^A-Z0-9 -]/g,'')+'*';let bits=encoded.split('').map(c=>dict[c]).join('0');let w=bits.length+18;let rects='';for(let i=0;i<bits.length;i++)if(bits[i]==='1')rects+=`<rect x="${i+9}" y="4" width="1" height="${height-23}" fill="#111"/>`;return `<svg class="barcode" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${height}" preserveAspectRatio="none" style="height:${height}px" role="img" aria-label="Code-barres ${esc(text)}"><rect width="100%" height="100%" fill="#fff"/>${rects}<text x="${w/2}" y="${height-6}" text-anchor="middle" font-size="9" letter-spacing="1.2" font-family="monospace" fill="#111">${esc(text)}</text></svg>`}
function renderLabel(item){const p=product(item.pid);return `<div class="label-preview"><div class="microbrand">${ico('layers',14)} STOCKPILOT <span style="margin-left:auto;font-size:9px;color:#718198">ÉTIQUETTE PRODUIT</span></div><h3>${esc(displayName(p))}</h3><p>${esc(p?.cat)} · Réf. ${esc(p?.ref)}</p><p><strong>${esc(pretty(item.slot))}</strong></p><p>Numéro de série : ${esc(item.serial||'Non renseigné')}</p><div class="label-bottom"><img style="width:102px;height:102px;object-fit:contain;border-radius:7px" src="/api/items/${encodeURIComponent(item.id)}/qr.png" alt="QR code de l'article"><div class="label-qr">${ico('barcode',29)}<br>${esc(item.id)}<br>QR SCANNABLE</div></div></div>`}
function renderExit(){return `${heading('FLUX DE SORTIE','Scanner une sortie','Scannez une étiquette ou sélectionnez un produit pour le retirer du stock.',btn('Consulter le stock','products','package',''))}<div class="flowgrid"><section class="card formcard"><h2>Scanner une étiquette</h2><p class="intro">Lecteur USB/Bluetooth ou saisie de l’identifiant. La caméra est disponible sur les navigateurs compatibles en HTTPS.</p><div class="scan-panel" id="scan-panel">${ico('barcode',55)}<strong style="font-size:15px">Prêt pour un scan</strong><p>Identifiant attendu : STK-000245, ou code-barres CODE 39 présent sur l’étiquette</p></div><div style="display:flex;gap:8px;margin:15px 0"><button class="btn" data-action="camera" style="flex:1">${ico('camera',17)} Activer la caméra</button><button class="btn" data-action="sample" style="flex:1">${ico('check',17)} Simuler un scan</button></div><label style="font-size:11px;font-weight:800;color:#566782" for="scan-code">Saisir ou scanner un identifiant</label><div class="scan-input" style="margin-top:8px"><input id="scan-code" placeholder="STK-000245" autocomplete="off"><button class="btn primary" data-action="lookup">${ico('search',16)} Rechercher</button></div><div class="hint" style="margin-top:16px">${ico('info',16)} Le bouton <strong>Simuler un scan</strong> permet de faire une démonstration complète, même sans douchette ni caméra.</div></section><section class="card formcard"><h2>Produit identifié</h2><p class="intro">Contrôlez sa référence et son emplacement avant de confirmer sa sortie.</p>${scanResult&&itemById(scanResult.id)?(()=>{let i=itemById(scanResult.id),p=product(i.pid);return `<div class="productpick"><div class="prodicon">${ico(p?.kind,25)}</div><div><strong>${esc(displayName(p))}</strong><small>${esc(i.id)} · ${esc(p?.ref)}</small></div></div><div class="reco"><div class="recohead">${ico('pin',16)} Emplacement de prélèvement</div><h3>${pretty(i.slot)}</h3><p>Numéro de série : ${esc(i.serial||'non renseigné')}</p></div><button class="btn negative full" data-action="confirmout" data-id="${i.id}">${ico('out',17)} Confirmer la sortie du stock</button>`})():`<div style="border:1px dashed #d8e3f2;border-radius:13px;padding:42px 20px;text-align:center;color:#8a9bb0">${ico('package',38)}<p style="margin:13px 0 0">Aucun produit scanné pour le moment.</p></div>`}<div style="margin-top:24px"><h3 style="font-size:12px;margin:0 0 10px">Retirer directement un produit</h3><div style="max-height:210px;overflow:auto;border:1px solid #e6ebf3;border-radius:10px">${db.items.slice(-6).reverse().map(i=>`<button data-action="selectscan" data-id="${i.id}" style="display:flex;align-items:center;gap:8px;width:100%;padding:10px;border:0;border-bottom:1px solid #edf0f5;background:white;text-align:left;color:#43526c;font-size:11px">${ico('package',15)} <span style="flex:1">${esc(displayName(product(i.pid)))}</span><strong>${esc(i.id)}</strong></button>`).join('')}</div></div></section></div>`}
function renderProducts(){const rows=db.items.filter(i=>{let p=product(i.pid);let s=(displayName(p)+' '+i.id+' '+i.serial+' '+i.slot+' '+p?.ref).toLowerCase();return (!tableFilter||s.includes(tableFilter.toLowerCase()))&&(tableZone==='all'||i.slot[0]===tableZone)&&(tableType==='all'||p?.cat===tableType)}).sort((a,b)=>b.inAt-a.inAt);return `${heading('CATALOGUE & INVENTAIRE','Produits en stock','Un suivi par appareil : chaque unité possède son identifiant et son emplacement.',btn('Ajouter un produit','newentry','plus'))}<section class="card"><div class="cardhead"><div><h2>Inventaire actuel</h2><p><strong>${rows.length}</strong> article(s) · Cliquez sur une ligne pour voir les détails.</p></div><button class="more" data-action="export">Exporter CSV ${ico('arrow',12)}</button></div><div class="filters"><input id="filter-products" placeholder="Marque, modèle, identifiant, série..." value="${esc(tableFilter)}" autocomplete="off"><select id="filter-zone"><option value="all">Toutes les zones</option>${ZONES.map(z=>`<option value="${z.id}" ${tableZone===z.id?'selected':''}>Zone ${z.id} · ${z.label}</option>`).join('')}</select><select id="filter-type"><option value="all">Toutes catégories</option>${[...new Set(db.catalog.map(x=>x.cat))].map(c=>`<option value="${esc(c)}" ${tableType===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="table-wrap"><table class="slim-table"><thead><tr><th>Produit</th><th>Identifiant</th><th>Numéro de série</th><th>Emplacement</th><th>Entrée</th><th>Statut</th><th></th></tr></thead><tbody>${rows.map(i=>{let p=product(i.pid);return `<tr class="clickrow" data-action="details" data-id="${i.id}"><td><div style="display:flex;align-items:center;gap:10px"><div class="prodicon" style="width:37px;height:37px">${ico(p?.kind,19)}</div><div><strong style="white-space:nowrap">${esc(displayName(p))}</strong><div style="color:#9babc0;font-size:10px;margin-top:3px">${esc(p?.cat)}</div></div></div></td><td style="font-weight:800">${esc(i.id)}</td><td>${esc(i.serial||'—')}</td><td><span class="pill blue">${ico('pin',12)} ${esc(i.slot)}</span></td><td>${fmtDate(i.inAt)}</td><td><span class="pill green">● En stock</span></td><td><button class="linkbtn" data-action="details" data-id="${i.id}">Détails →</button></td></tr>`}).join('')||`<tr><td colspan="7" class="empty">Aucun produit ne correspond à votre recherche.</td></tr>`}</tbody></table></div></section>`}
function renderMapPage(){let i=itemAt(selectedSlot),z=zoneOf(selectedSlot)||ZONES[0];return `${heading('LOCALISATION DES ARTICLES','Plan du dépôt','48 emplacements répartis en 6 zones. Cliquez sur n’importe quelle case.',btn('Entrer un produit','newentry','in'))}<div class="bigmap"><section class="card mapcard"><div class="cardhead"><div><h2>Entrepôt · Vue isométrique</h2><p>Survol ou sélection d’une case pour connaître son contenu</p></div><div class="tag" style="background:#edf9f3;color:#14946d">${ALLSLOTS.length-db.items.length} libres / ${ALLSLOTS.length}</div></div>${renderMap('full')}<div class="maplegend"><span><i class="dot" style="background:#5395e8"></i>Case occupée</span><span><i class="dot" style="background:#f8faff;border:1px solid #b6c8de"></i>Case libre</span><span><i class="dot" style="background:#2cd5a3"></i>Sélection</span></div></section><section class="card mapdetail"><div class="eyebrow">LOCALISATION</div><h2>Sélection d’un emplacement</h2><div class="zonechips">${ZONES.map(zz=>`<button class="zonechip ${zz.id===z.id?'active':''}" data-action="zone" data-zone="${zz.id}">Zone ${zz.id}</button>`).join('')}</div><div style="display:flex;align-items:center;gap:12px"><div class="icbox blue" style="width:46px;height:46px">${ico('pin',21)}</div><div><strong style="font-size:18px">${esc(selectedSlot)}</strong><div style="font-size:11px;color:#94a0b2;margin-top:4px">${pretty(selectedSlot)}</div></div></div><div class="shelfcard">${[1,2].map(sh=>`<div class="shelfrow"><strong>Étagère ${sh}</strong>${[1,2,3,4].map(c=>{let sl=`${z.id}-${sh}-${c}`;return `<button data-action="pickslot" data-slot="${sl}" title="${pretty(sl)}" class="shelf-cell ${itemAt(sl)?'full':''} ${selectedSlot===sl?'chosen':''}">${c}</button>`}).join('')}</div>`).join('')}</div><div class="slotdetail"><h3>${i?'● Occupé':'○ Libre'}</h3><p>${i?`Un article est stocké à cet emplacement, dans la zone ${z.label}.`:'Cet emplacement est disponible pour une nouvelle entrée en stock.'}</p>${i?`<div class="slotoccupant">${esc(displayName(product(i.pid)))}</div><div style="font-size:11px;color:#8d9cb0;margin:6px 0 12px">${esc(i.id)}</div><button class="btn small primary full" data-action="details" data-id="${i.id}">${ico('eye',15)} Voir la fiche</button>`:`<button class="btn small primary full" data-action="entryslot" data-slot="${selectedSlot}">${ico('in',15)} Ranger un produit ici</button>`}</div><div class="hint" style="margin-top:15px">${ico('info',15)} Un emplacement = un appareil dans cette démonstration. La capacité et les zones seraient configurées selon le vrai dépôt.</div></section></div>`}

function renderSettings(){return `${heading('ADMINISTRATION','Configuration du stock','Gérez les références, les accès employés et les règles de rangement.') }<div class="flowgrid"><section class="card settingscard"><h2>Règles de rangement automatique</h2><p>Chaque modèle dispose d'une zone conseillée. Le système propose automatiquement la première case libre dans sa zone.</p>${ZONES.map(z=>{const a=db.items.filter(i=>i.slot.startsWith(z.id+'-')).length;return `<div class="ruleitem"><span class="zonebadge">${z.id}</span><div><strong>Zone ${z.id} · ${z.label}</strong><small>${a}/8 emplacements utilisés · ${z.brands}</small></div><span class="badgeend">Actif</span></div>`}).join('')}<p class="intro" style="margin-top:14px">Vous pouvez changer la zone par modèle dans le catalogue. Les déplacements manuels sont aussi enregistrés.</p></section><section class="card settingscard"><h2>Mon compte</h2><p>Connecté : <strong>${esc(me.username)}</strong> · ${me.role==='admin'?'Administrateur':'Employé'}</p><form id="password-form"><div class="field"><label>Mot de passe actuel</label><input name="old_password" type="password" required autocomplete="current-password"></div><div class="field"><label>Nouveau mot de passe (12 caractères minimum)</label><input name="new_password" type="password" required minlength="12" autocomplete="new-password"></div><button class="btn primary" type="submit">Changer mon mot de passe</button></form><p style="margin-top:18px"><a href="/logout">Se déconnecter</a></p></section></div>${me.role==='admin'?`<div class="flowgrid" style="margin-top:18px"><section class="card settingscard"><h2>Catalogue des références</h2><p>Créer un modèle qui pourra être sélectionné lors des entrées en stock.</p><form id="catalog-form" class="catalog-form"><div class="twofields"><div class="field"><label>Marque *</label><input name="brand" required maxlength="60" placeholder="Ex. TERRA"></div><div class="field"><label>Modèle *</label><input name="model" required maxlength="100" placeholder="Ex. Mobile 1517"></div></div><div class="twofields"><div class="field"><label>Catégorie *</label><select name="cat"><option>PC portable</option><option>PC fixe</option><option>Écran</option><option>Accessoire</option><option>Autre</option></select></div><div class="field"><label>Zone conseillée *</label><select name="zone">${ZONES.map(z=>`<option value="${z.id}">${z.id} · ${z.label}</option>`).join('')}</select></div></div><div class="field"><label>Référence interne *</label><input name="ref" maxlength="80" required placeholder="Ex. TE-MOB1517"></div><button class="btn primary" type="submit">${ico('plus',16)} Ajouter la référence</button></form><div style="margin-top:18px;max-height:300px;overflow:auto">${db.catalog.map(p=>`<div class="ruleitem"><div><strong>${esc(displayName(p))}</strong><small>${esc(p.ref)} · Zone ${p.zone} ${p.active?'':'· DÉSACTIVÉ'}</small></div><button class="btn" style="font-size:11px;padding:7px 9px" data-action="editproduct" data-id="${esc(p.id)}">Modifier</button></div>`).join('')}</div></section><section class="card settingscard"><h2>Accès employés</h2><p>Créez un compte distinct pour identifier qui effectue chaque mouvement.</p><form id="user-form"><div class="field"><label>Identifiant *</label><input name="username" required maxlength="50" placeholder="Ex. accueil1"></div><div class="field"><label>Mot de passe initial *</label><input name="password" required type="password" minlength="12" autocomplete="new-password"></div><div class="field"><label>Rôle</label><select name="role"><option value="employee">Employé</option><option value="admin">Administrateur</option></select></div><button class="btn primary" type="submit">${ico('plus',16)} Créer le compte</button></form><div style="display:flex;gap:9px;flex-wrap:wrap;margin:18px 0"><button class="btn" data-action="listusers">${ico('grid',16)} Gérer les utilisateurs</button><button class="btn" data-action="backup">${ico('arrow',16)} Télécharger sauvegarde</button></div><p style="font-size:12px;color:#72819a">Données enregistrées sur le volume Docker du NAS. Sauvegardez également ce volume.</p>${allowReset?`<button class="btn negative" data-action="reset">Réinitialiser le stock fictif</button>`:''}</section></div>`:''}`}
function renderModal(){if(!modal)return '';if(modal.type==='details'){let i=itemById(modal.id);if(!i)return '';let p=product(i.pid);return `<div class="overlay" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="Détails produit"><div class="modal-head"><h2>Détail de l’article</h2><button class="closebtn" data-action="closemodal">${ico('close',18)}</button></div><div class="modal-body"><div class="productpick" style="margin:0 0 16px"><div class="prodicon">${ico(p?.kind,24)}</div><div><strong>${esc(displayName(p))}</strong><small>${esc(p?.ref)}</small></div></div><div class="reco"><div class="recohead">${ico('pin',17)} Stockage actuel</div><h3>${pretty(i.slot)}</h3><p>ID : ${esc(i.id)}</p></div><p style="line-height:2;color:#546681"><strong>N° de série :</strong> ${esc(i.serial||'Non renseigné')}<br><strong>État :</strong> ${esc(i.condition)}<br><strong>Entrée :</strong> ${fmtDate(i.inAt)} à ${fmtTime(i.inAt)}</p></div><div class="modal-foot"><button class="btn" data-action="print" data-id="${i.id}">${ico('printer',15)} Étiquette</button><button class="btn" data-action="movemodal" data-id="${i.id}">${ico('layers',15)} Déplacer</button><button class="btn negative" data-action="outfrommodal" data-id="${i.id}">${ico('out',15)} Sortir</button><button class="btn" data-action="closemodal">Fermer</button></div></div></div>`}
if(modal.type==='confirmout'){let i=itemById(modal.id);if(!i)return '';return `<div class="overlay" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>Confirmer une sortie</h2><button class="closebtn" data-action="closemodal">${ico('close',18)}</button></div><div class="modal-body"><p>Marquer cet article comme sorti du stock ? Le mouvement restera visible dans l’historique.</p><div class="productpick"><div class="prodicon">${ico('package',23)}</div><div><strong>${esc(displayName(product(i.pid)))}</strong><small>${esc(i.id)} · ${pretty(i.slot)}</small></div></div></div><div class="modal-foot"><button class="btn" data-action="closemodal">Annuler</button><button class="btn negative" data-action="remove" data-id="${i.id}">${ico('out',16)} Confirmer la sortie</button></div></div></div>`}
if(modal.type==='move'){let i=itemById(modal.id);if(!i)return '';return `<div class="overlay" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>Déplacer un article</h2><button class="closebtn" data-action="closemodal">${ico('close',18)}</button></div><div class="modal-body"><p>${esc(i.id)} · emplacement actuel : <strong>${esc(i.slot)}</strong></p><div class="field"><label for="move-slot">Nouvel emplacement</label><select id="move-slot">${ALLSLOTS.filter(s=>s!==i.slot&&!itemAt(s)).map(s=>`<option value="${s}">${pretty(s)}</option>`).join('')}</select></div></div><div class="modal-foot"><button class="btn" data-action="closemodal">Annuler</button><button class="btn primary" data-action="confirmmove" data-id="${esc(i.id)}">Déplacer</button></div></div></div>`}if(modal.type==='editproduct'){const p=product(modal.id);if(!p)return '';return `<div class="overlay" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>Modifier le produit</h2><button class="closebtn" data-action="closemodal">${ico('close',18)}</button></div><form id="edit-product-form" data-id="${esc(p.id)}"><div class="modal-body"><div class="field"><label>Marque</label><input name="brand" required value="${esc(p.brand)}"></div><div class="field"><label>Modèle</label><input name="model" required value="${esc(p.model)}"></div><div class="field"><label>Référence</label><input name="ref" required value="${esc(p.ref)}"></div><div class="field"><label>Catégorie</label><input name="cat" required value="${esc(p.cat)}"></div><div class="field"><label>Zone conseillée</label><select name="zone">${ZONES.map(z=>`<option value="${z.id}" ${p.zone===z.id?'selected':''}>${z.id} · ${z.label}</option>`).join('')}</select></div><label><input type="checkbox" name="active" ${p.active?'checked':''}> Référence active pour les nouvelles entrées</label></div><div class="modal-foot"><button class="btn" type="button" data-action="closemodal">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form></div></div>`}if(modal.type==='users'){return `<div class="overlay" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>Comptes utilisateurs</h2><button class="closebtn" data-action="closemodal">${ico('close',18)}</button></div><div class="modal-body">${users.map(u=>`<div class="ruleitem"><div><strong>${esc(u.username)}</strong><small>${u.role==='admin'?'Administrateur':'Employé'} · ${u.enabled?'Actif':'Désactivé'}</small></div><button class="btn" data-action="toggleuser" data-id="${u.id}" ${u.id===me.id?'disabled':''}>${u.enabled?'Désactiver':'Activer'}</button></div>`).join('')||'Aucun compte'}</div><div class="modal-foot"><button class="btn" data-action="closemodal">Fermer</button></div></div></div>`}if(modal.type==='reset')return `<div class="overlay" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>Réinitialiser la démo ?</h2><button class="closebtn" data-action="closemodal">${ico('close',18)}</button></div><div class="modal-body"><p>Les données de démonstration seront réinitialisées sur le NAS. Les articles et les historiques seront supprimés pour tous les employés.</p></div><div class="modal-foot"><button class="btn" data-action="closemodal">Annuler</button><button class="btn negative" data-action="doreset">Réinitialiser</button></div></div></div>`;return ''}
function renderContent(){const cont=$('#content');if(cont)cont.innerHTML=renderPage();}
function setSlot(slot){if(!ALLSLOTS.includes(slot))return;selectedSlot=slot;if(page==='entry'){if(!itemAt(slot)){chosenSlot=slot;renderContent();$('#slot-in')?.setAttribute('value',slot)}else toast('Case occupée : sélectionnez une case libre',true)}else{renderContent()}}
function printLabel(id){const i=itemById(id)||lastAdded;if(!i)return toast('Article introuvable',true);const win=window.open('/label/'+encodeURIComponent(i.id),'_blank');if(!win)toast('Autorisez les fenêtres contextuelles pour imprimer',true)}
async function recordEntry(){const p=product(selectedProduct),s=$('#slot-in')?.value||chosenSlot||firstFree(p?.zone);if(!p)return toast('Sélectionnez un produit',true);if(!ALLSLOTS.includes(s))return toast('Sélectionnez un emplacement valide',true);const serial=$('#serial-in')?.value.trim()||'',condition=$('#condition-in')?.value||'Neuf';try{const result=await api('/api/items','POST',{pid:p.id,slot:s,serial,condition});await refreshState(true);lastAdded=result.item;selectedSlot=s;renderContent();toast(`${displayName(p)} ajouté en ${s}`)}catch(e){toast(e.message,true);await refreshState(true);renderContent()}}
async function removeItem(id){const i=itemById(id);if(!i)return toast('Article déjà sorti',true);try{await api('/api/items/'+encodeURIComponent(id)+'/out','POST',{});modal=null;scanResult=null;await refreshState(true);renderApp();toast(`${displayName(product(i.pid))} sorti du stock · ${i.slot} libéré`)}catch(e){toast(e.message,true);await refreshState(true);renderApp()}}
function renderApp(){$('#app').innerHTML=layout()}
function lookup(code){const id=String(code||'').trim().toUpperCase();if(!id){toast('Saisissez ou scannez un identifiant',true);return}const i=itemById(id);if(!i){toast('Aucun produit en stock avec cet identifiant',true);return}scanResult=i;renderContent();toast(`Produit trouvé : ${displayName(product(i.pid))}`)}
function downloadCSV(name,rows){let csv='\ufeff'+rows.map(cols=>cols.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),600)}
function exportStock(){downloadCSV('stockpilot-inventaire.csv',[['Identifiant','Marque','Modèle','Catégorie','N° de série','État','Emplacement','Date entrée'],...db.items.map(i=>{let p=product(i.pid);return [i.id,p?.brand,p?.model,p?.cat,i.serial,i.condition,i.slot,new Date(i.inAt).toLocaleString('fr-FR')]})]);toast('Inventaire CSV téléchargé')}
function exportHistory(){downloadCSV('stockpilot-historique.csv',[['Date','Type','Produit','Identifiant','Emplacement','Opérateur'],...db.events.map(e=>[new Date(e.at).toLocaleString('fr-FR'),e.type==='in'?'Entrée':e.type==='out'?'Sortie':'Déplacement',displayName(product(e.pid)),e.itemId,e.slot,e.actor])]);toast('Journal CSV téléchargé')}
function openModal(m){modal=m;renderApp()}function closeModal(){modal=null;renderApp()}
async function startCamera(){if(scanning){stopCamera();renderContent();return}const panel=$('#scan-panel');if(!navigator.mediaDevices?.getUserMedia){toast('La caméra nécessite un navigateur compatible et une connexion sécurisée (HTTPS)',true);return}try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});scanning=true;let video=document.createElement('video');video.setAttribute('playsinline','');video.setAttribute('autoplay','');video.muted=true;video.srcObject=cameraStream;panel.innerHTML='';panel.appendChild(video);await video.play();const detector=typeof BarcodeDetector==='function'?new BarcodeDetector({formats:['code_39','code_128','qr_code','ean_13']}):null;if(!detector){toast('Lecture automatique non prise en charge sur ce navigateur : utilisez la douchette ou la saisie manuelle',true);return}toast('Caméra active. Présentez une étiquette.');const token=++activeCameraRun;let loops=0;async function tick(){if(!scanning||token!==activeCameraRun)return;try{let reads=await detector.detect(video);for(let r of reads){const value=String(r.rawValue||'').trim().toUpperCase();if(value.startsWith('STK-')){stopCamera();lookup(value);return}}}catch(e){}if(scanning&&token===activeCameraRun){loops++;setTimeout(tick,250)}}tick()}catch(e){stopCamera();toast('Impossible d’accéder à la caméra. Vérifiez les autorisations ou utilisez un scanner USB.',true)}}
function stopCamera(){scanning=false;activeCameraRun++;if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}
function searchGlobal(v){searchTerm=v;page='products';tableFilter=v;renderApp();const f=$('#filter-products');if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}}
// Global delegated controls
window.addEventListener('click',ev=>{const n=ev.target.closest('[data-nav]');if(n){nav(n.dataset.nav);return}const slot=ev.target.closest('[data-slot]');if(slot){setSlot(slot.dataset.slot);return}const a=ev.target.closest('[data-action]');if(!a)return;const act=a.dataset.action,id=a.dataset.id;if(act==='backdrop'){if(ev.target===a)closeModal();return}switch(act){case'menu':mobileNav=true;renderApp();break;case'closemenu':mobileNav=false;renderApp();break;case'newentry':goEntry();break;case'goexit':goExit();break;case'gomap':nav('map');break;case'saveentry':recordEntry();break;case'print':printLabel(id);break;case'lookup':lookup($('#scan-code')?.value);break;case'sample':{let sample=db.items[db.items.length-1];if(sample)lookup(sample.id);else toast('Le stock est vide',true);break}case'camera':startCamera();break;case'selectscan':scanResult=itemById(id);renderContent();break;case'confirmout':case'outfrommodal':openModal({type:'confirmout',id});break;case'remove':removeItem(id);break;case'details':openModal({type:'details',id});break;case'closemodal':closeModal();break;case'entryslot':selectedProduct=product(db.catalog.find(p=>p.zone===a.dataset.slot[0])?.id)?.id||db.catalog[0].id;chosenSlot=a.dataset.slot;lastAdded=null;nav('entry');break;case'zone':selectedSlot=`${a.dataset.zone}-1-1`;renderContent();break;case'pickslot':setSlot(a.dataset.slot);break;case'export':exportStock();break;case'exporthistory':exportHistory();break;case'reset':openModal({type:'reset'});break;case'doreset':(async()=>{try{await api('/api/admin/reset','POST',{});formSerial='';lastAdded=null;scanResult=null;selectedSlot='A-1-1';modal=null;await refreshState(true);nav('dashboard');toast('Stock fictif réinitialisé')}catch(e){toast(e.message,true)}})();break;case'movemodal':openModal({type:'move',id});break;case'confirmmove':(async()=>{try{await api('/api/items/'+encodeURIComponent(id)+'/move','POST',{slot:$('#move-slot')?.value});modal=null;await refreshState(true);renderApp();toast('Article déplacé')}catch(e){toast(e.message,true)}})();break;case'editproduct':openModal({type:'editproduct',id});break;case'listusers':(async()=>{try{users=(await api('/api/users')).users;openModal({type:'users'})}catch(e){toast(e.message,true)}})();break;case'toggleuser':(async()=>{const u=users.find(x=>String(x.id)===String(id));if(!u)return;try{await api('/api/users/'+id,'PATCH',{enabled:!u.enabled});users=(await api('/api/users')).users;openModal({type:'users'});toast('Compte mis à jour')}catch(e){toast(e.message,true)}})();break;case'backup':window.open('/api/backup','_blank');break;}});
window.addEventListener('submit',async e=>{const f=e.target;if(!['catalog-form','user-form','password-form','edit-product-form'].includes(f.id))return;e.preventDefault();const data=Object.fromEntries(new FormData(f).entries());try{if(f.id==='catalog-form'){await api('/api/products','POST',data);toast('Référence ajoutée')}else if(f.id==='user-form'){await api('/api/users','POST',data);toast('Compte employé créé')}else if(f.id==='edit-product-form'){data.active=!!f.querySelector('[name=active]').checked;await api('/api/products/'+encodeURIComponent(f.dataset.id),'PATCH',data);modal=null;toast('Produit modifié')}else{await api('/api/me/password','POST',data);toast('Mot de passe modifié')}f.reset();await refreshState(true);renderApp()}catch(err){toast(err.message,true)}});
window.addEventListener('change',e=>{if(e.target.id==='product-select'){selectedProduct=e.target.value;chosenSlot=null;renderContent()}else if(e.target.id==='condition-in'){formCondition=e.target.value}else if(e.target.id==='slot-in'){chosenSlot=e.target.value;selectedSlot=chosenSlot;renderContent()}else if(e.target.id==='filter-zone'){tableZone=e.target.value;renderContent()}else if(e.target.id==='filter-type'){tableType=e.target.value;renderContent()}});
window.addEventListener('input',e=>{if(e.target.id==='serial-in'){formSerial=e.target.value}else if(e.target.id==='filter-products'){tableFilter=e.target.value;let st=e.target.selectionStart;renderContent();const inp=$('#filter-products');if(inp){inp.focus();inp.setSelectionRange(st,st)}}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal();else if(e.key==='Enter'&&e.target.id==='scan-code'){e.preventDefault();lookup(e.target.value)}else if(e.key==='Enter'&&e.target.id==='global-search'){e.preventDefault();searchGlobal(e.target.value)}else if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-slot]')){e.preventDefault();setSlot(e.target.dataset.slot)}});
window.addEventListener('pagehide',stopCamera);
document.querySelector('#app').innerHTML='<div style="display:grid;place-items:center;min-height:100vh;color:#53657f;font-family:system-ui">Chargement du stock partagé…</div>';
refreshState();
setInterval(()=>{if(!document.hidden&&!modal&&page!=='entry'&&page!=='exit')refreshState(true)},20000);
})();
</script>
</body>
</html>
