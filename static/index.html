 if(!current)return;

 const fresh=wrapper.querySelector('.aurora-dashboard');
 if(!fresh)return;

  const existing=[...current.querySelectorAll(selector)];
  const incoming=[...fresh.querySelectorAll(selector)];
  if(existing.length!==incoming.length)return;
  existing.forEach((node,i)=>{
   if(node.textContent!==incoming[i].textContent)node.textContent=incoming[i].textContent;
  });
 };
 const syncInlineText=selector=>{
  const existing=[...current.querySelectorAll(selector)];
  const incoming=[...fresh.querySelectorAll(selector)];
  if(existing.length!==incoming.length)return;
  existing.forEach((node,i)=>{
   const a=[...node.childNodes].find(child=>child.nodeType===3);
   const b=[...incoming[i].childNodes].find(child=>child.nodeType===3);
   if(a&&b&&a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;
  });
 };

  const old=oldRoot?.querySelector(selector),fresh=newRoot?.querySelector(selector);

   old.innerHTML=fresh.innerHTML;

async function syncStockAcrossDevices(){
 if(liveSyncBusy||!liveSyncActive||document.hidden||stockRevision<0)return;
 liveSyncBusy=true;
 try{
  const next=await api('/api/sync/revision');
  if(typeof next.revision==='number'&&next.revision>stockRevision){
   const snapshot=await api('/api/state');
   if(receiveStockSnapshot(snapshot)){
    if(modal?.type==='users'&&me.role==='admin'){
     try{users=(await api('/api/users')).users||users}catch(e){}
    }
    patchLiveStockView();
    if(henrriConfigured)fetchHenrriValuation();
   }
  }
 }catch(e){
  // Perte de réseau provisoire : garder le formulaire et réessayer au cycle suivant.
  console.warn('StockPilot: synchronisation momentanément indisponible');
 }finally{liveSyncBusy=false;liveSyncLastCheck=Date.now()}
}

// Lecteur commun Safari iPhone / Android / ordinateur : QR Code, Code 128 et Code 39.
// Chargement à la demande : aucune dépendance au CDN sur les autres pages.
let cameraReader=null, scannerLibraryPending=null;
function ensureScannerLibrary(){
 if(typeof window.Html5Qrcode==='function')return Promise.resolve();
 if(scannerLibraryPending)return scannerLibraryPending;
 scannerLibraryPending=new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';
  script.async=true;
  script.onload=()=>typeof window.Html5Qrcode==='function'?resolve():reject(new Error('Lecteur de codes indisponible.'));
  script.onerror=()=>reject(new Error('Impossible de charger le lecteur de codes. Vérifiez la connexion internet.'));
  document.head.appendChild(script);
 }).catch(e=>{scannerLibraryPending=null;throw e});
 return scannerLibraryPending;
}
async function startCamera(){
 if(scanning){await stopCamera();if(page==='exit'||page==='stocktake')renderContent();return}
 const panel=$('#scan-panel');
 if(!panel)return;
 if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){
  toast('La caméra nécessite une connexion HTTPS et un navigateur autorisant la caméra.',true);
  return;
 }
 const token=++activeCameraRun;
 scanning=true;
 panel.classList.add('sp-camera-active');
 panel.innerHTML='<div id="sp-camera-reader"></div><p class="sp-camera-hint">Placez le QR code ou le code-barres devant la caméra.</p>';
 const button=document.querySelector('[data-action="camera"]');
 if(button)button.innerHTML=ico('close',17)+' Arrêter la caméra';
 try{
  await ensureScannerLibrary();
  if(token!==activeCameraRun||!['exit','stocktake'].includes(page))return;
  const format=window.Html5QrcodeSupportedFormats;
  cameraReader=new window.Html5Qrcode('sp-camera-reader',{
   formatsToSupport:[format.QR_CODE,format.CODE_128,format.CODE_39],
   verbose:false
  });
  await cameraReader.start(
   {facingMode:'environment'},
   {fps:10},
   async decoded=>{
    if(token!==activeCameraRun||!scanning)return;
    const id=String(decoded||'').trim().toUpperCase();
    if(!/^STK-[A-Z0-9-]+$/.test(id))return;
    if(page==='exit')lookup(id,true);
    else if(page==='stocktake'){await stopCamera();scanStocktake(id);}
   },
   ()=>{}
  );
  if(token!==activeCameraRun)await stopCamera();
 }catch(error){
  if(token!==activeCameraRun)return;
  await stopCamera();
  if(page==='exit'||page==='stocktake')renderContent();
  const msg=String(error?.message||error||'');
  const blocked=/NotAllowed|Permission|denied|refus|access/i.test(msg);
  toast(blocked?'Autorisez l’accès à la caméra dans les réglages du navigateur puis réessayez.':
   'Impossible de démarrer le scan : '+msg+' Vous pouvez toujours saisir le code manuellement.',true);
 }
}
function stopCamera(){
 scanning=false;activeCameraRun++;
 const reader=cameraReader;cameraReader=null;
 let stopping=Promise.resolve();
 if(reader){
  try{
   stopping=reader.isScanning?Promise.resolve(reader.stop()).catch(()=>{}):Promise.resolve();
   stopping=stopping.then(()=>{try{reader.clear()}catch(e){}});
  }catch(e){try{reader.clear()}catch(err){}}
 }
 if(cameraStream){
  cameraStream.getTracks().forEach(t=>t.stop());
  cameraStream=null;
 }
 return stopping;
}

function decodePushKey(encoded){

const PUSH_PREFERENCE_KEY='stockpilot-notifications-enabled';
function rememberPushPreference(enabled){
 try{window.localStorage.setItem(PUSH_PREFERENCE_KEY,enabled?'1':'0')}catch(e){}
}
function wantsPushNotifications(){

let pushRecoveryRunning=false;
async function restorePushOnAppLaunch(){
 if(pushRecoveryRunning||!pushAvailable()||Notification.permission!=='granted')return;
 pushRecoveryRunning=true;
 try{
  const registration=await navigator.serviceWorker.ready;
  let sub=await registration.pushManager.getSubscription();
  if(!sub&&wantsPushNotifications()){
   // Préférence déjà donnée par l'utilisateur. Ne jamais redemander la permission.
   const keyData=await api('/api/push/public-key');
   sub=await registration.pushManager.subscribe({
    userVisibleOnly:true,applicationServerKey:decodePushKey(keyData.publicKey)
   });
  }
  if(sub){
   // Répare un éventuel abonnement serveur manquant après une mise à jour, sans
   // demander de réinstaller l'app ni réactiver les notifications.
   await api('/api/push/subscriptions','POST',sub.toJSON());
   rememberPushPreference(true);
  }
 }catch(e){
  console.warn('StockPilot: récupération des notifications à vérifier');
 }finally{
  pushRecoveryRunning=false;
  updatePushButton();
 }
}
async function updatePushButton(){

 if(!btn)return;
 // Aucune réapparition du bandeau pendant la vérification de l'abonnement.
 if(stockBanner)stockBanner.hidden=true;
 if(!pushAvailable()){
  btn.disabled=true;btn.textContent='Indisponible';return;
 }
 try{
  const reg=await navigator.serviceWorker.ready;
  const sub=await reg.pushManager.getSubscription();
  const current=document.querySelector('[data-action="pushsubscribe"]');
  if(!current)return;
  const active=!!sub&&Notification.permission==='granted';
  current.textContent=active?'Désactiver':'Activer';
  current.dataset.subscribed=active?'yes':'no';
  current.disabled=false;
  if(active)rememberPushPreference(true);
  const visibleBanner=document.querySelector('.si-mobile-push');
  if(visibleBanner)visibleBanner.hidden=active;
 }catch(e){
  const current=document.querySelector('[data-action="pushsubscribe"]');
  if(current){current.textContent='Réessayer';current.disabled=false}
  const visibleBanner=document.querySelector('.si-mobile-push');
  if(visibleBanner)visibleBanner.hidden=false;
 }

async function togglePushSubscription(button){
 if(!pushAvailable())return toast('Notifications non prises en charge par ce navigateur.',true);
 if(/iPhone|iPad|iPod/i.test(navigator.userAgent||'')&&!isStockPilotStandalone()){
  toast('Sur iPhone : ajoute StockPilot à l’écran d’accueil, puis ouvre son icône pour activer les notifications.',true);
  return;
 }
 if(button.dataset.subscribed==='yes'){
  try{
   const reg=await navigator.serviceWorker.ready;
   const sub=await reg.pushManager.getSubscription();
   if(sub){
    await api('/api/push/subscriptions','DELETE',{endpoint:sub.endpoint});
    await sub.unsubscribe();
   }
   rememberPushPreference(false);
   toast('Notifications désactivées sur cet appareil.');
   updatePushButton();
  }catch(e){toast(e.message||'Impossible de désactiver les notifications.',true)}
  return;
 }
 // Permission appelée immédiatement dans le geste de l'utilisateur, exigé par iOS.
 const permissionRequest=Notification.requestPermission();
 try{
  const permission=await permissionRequest;
  if(permission!=='granted'){toast('Autorisez les notifications dans les réglages de votre iPhone.',true);return}
  button.disabled=true;button.textContent='Activation…';
  const keyData=await api('/api/push/public-key');
  const registration=await navigator.serviceWorker.ready;
  let sub=await registration.pushManager.getSubscription();
  if(!sub)sub=await registration.pushManager.subscribe({
   userVisibleOnly:true,applicationServerKey:decodePushKey(keyData.publicKey)
  });
  await api('/api/push/subscriptions','POST',sub.toJSON());
  rememberPushPreference(true);
  toast('Notifications de stock activées sur cet appareil.');
  // Contrôle réel : la notification de test va uniquement au compte connecté.
  const result=await api('/api/push/test','POST',{});
  if(!result.ok)toast('Abonnement enregistré, mais la notification de test n’a pas pu être envoyée.',true);
 }catch(e){toast(e.message||'Impossible d’activer les notifications.',true)}
 finally{updatePushButton()}
}

// Safari iPhone : bloquer uniquement le dépassement aux extrémités sans casser le défilement.
(function disableViewportRubberBand(){
 let previousY=null,previousX=null;
 document.addEventListener('touchstart',event=>{
  if(event.touches.length!==1){previousY=null;return}
  previousY=event.touches[0].clientY;
  previousX=event.touches[0].clientX;
 },{passive:true});
 document.addEventListener('touchmove',event=>{
  if(event.touches.length!==1||previousY===null||!event.cancelable)return;
  const y=event.touches[0].clientY,x=event.touches[0].clientX;
  const delta=y-previousY,deltaX=x-previousX;
  previousY=y;previousX=x;
  if(Math.abs(delta)<=1||Math.abs(deltaX)>Math.abs(delta))return;
  // Un panneau qui peut encore défiler ne doit jamais être bloqué.
  let node=event.target;
  while(node&&node!==document.body&&node!==document.documentElement){
   if(node.nodeType===1){
    const style=window.getComputedStyle(node);
    if(/auto|scroll/.test(style.overflowY)&&node.scrollHeight>node.clientHeight+1){
     if((delta>0&&node.scrollTop>0)||(delta<0&&node.scrollTop+node.clientHeight<node.scrollHeight-1))return;
    }
   }
   node=node.parentElement;
  }
  const root=document.scrollingElement||document.documentElement;
  const top=window.scrollY||root.scrollTop||0;
  const max=Math.max(0,root.scrollHeight-window.innerHeight);
  if((delta>0&&top<=0)||(delta<0&&top>=max-1))event.preventDefault();
 },{passive:false});
})();
