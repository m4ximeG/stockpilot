# Installation neuve sur le serveur du travail.
# Ne pas monter le volume /data du NAS de test : le volume ci-dessous crée une base vide.
# Le répertoire source de la sauvegarde DOIT être un partage NAS/autre disque réellement indépendant.
services:
  stockpilot:
    image: ${STOCKPILOT_IMAGE:?Indiquer une image GHCR avec un tag sha-... validé}
    container_name: stockpilot-work
    restart: unless-stopped
    ports:
      - "${STOCKPILOT_BIND_ADDRESS:-127.0.0.1}:8787:8080"
    environment:
      STOCKPILOT_DATA_DIR: /data
      STOCKPILOT_ADMIN_USERNAME: ${STOCKPILOT_ADMIN_USERNAME:-admin}
      STOCKPILOT_ADMIN_PASSWORD: ${STOCKPILOT_ADMIN_PASSWORD:?Mot de passe admin requis, 12 caractères minimum}
      STOCKPILOT_SECRET_KEY: ${STOCKPILOT_SECRET_KEY:?Clé aléatoire requise}
      STOCKPILOT_DEV_FIXTURES: "0"
      STOCKPILOT_DEMO_SEED: "0"
      STOCKPILOT_ALLOW_RESET: "0"
      STOCKPILOT_SECURE_COOKIES: "1"
      STOCKPILOT_EXTERNAL_BACKUP_DIR: /external-backups
      HENRRI_ENVIRONMENT: production
      HENRRI_CLIENT_ID: ${HENRRI_CLIENT_ID:?Identifiant Henrri requis}
      HENRRI_CLIENT_SECRET: ${HENRRI_CLIENT_SECRET:?Secret Henrri requis}
    volumes:
      - stockpilot_work_data:/data
      - type: bind
        source: ${STOCKPILOT_EXTERNAL_BACKUP_HOST_PATH:?Chemin monte vers un autre NAS ou support requis}
        target: /external-backups
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  stockpilot_work_data:
